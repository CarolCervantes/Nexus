version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nexus_db
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secure_password_2026
      POSTGRES_DB: nexus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://nexus:nexus_secure_password_2026@db:5432/nexus_db
      JWT_SECRET: nexus_docker_jwt_secret_2026_xyz
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_TIMEZONE: America/Bogota
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
