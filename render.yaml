services:
  - type: web
    name: nexus-life-agent
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_TIMEZONE
        value: America/Bogota

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus_admin
